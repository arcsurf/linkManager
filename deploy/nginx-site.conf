server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/linkmanager;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Logout: el panel reemplaza la contraseña guardada en el navegador por
    # logout:logout, que solo es válida para este archivo.
    location = /admin/logout.txt {
        auth_basic "linkManager";
        auth_basic_user_file /var/lib/linkmanager/htpasswd-logout;
        add_header Cache-Control no-store;
    }

    # Panel de administración
    location /admin/ {
        auth_basic "linkManager";
        auth_basic_user_file /var/lib/linkmanager/htpasswd;
        add_header Cache-Control no-store;
        try_files $uri $uri/ =404;
    }

    # API (servicio linkmanager en localhost)
    location /api/ {
        auth_basic "linkManager";
        auth_basic_user_file /var/lib/linkmanager/htpasswd;
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }
}
