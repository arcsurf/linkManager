server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/linkmanager;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Logout: the panel replaces the password stored in the browser with
    # logout:logout, which is only valid for this file.
    location = /admin/logout.txt {
        auth_basic "linkManager";
        auth_basic_user_file /var/lib/linkmanager/htpasswd-logout;
        add_header Cache-Control no-store;
    }

    # Admin panel
    location /admin/ {
        auth_basic "linkManager";
        auth_basic_user_file /var/lib/linkmanager/htpasswd;
        add_header Cache-Control no-store;
        try_files $uri $uri/ =404;
    }

    # API (linkmanager service on localhost)
    location /api/ {
        auth_basic "linkManager";
        auth_basic_user_file /var/lib/linkmanager/htpasswd;
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }
}
